name: CI

on: 
  push:
    branches:
      - master
      - linux-build-fixes # Temporary branch for Linux build fixes

jobs:
  build_compressonator_apps:
    runs-on: ubuntu-latest
    container: ghcr.io/iamsomeone2/compressonator-builder:fedora42

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          fetch-depth: 1

      # TODO: Add ccache support
      
      - name: Create Build directory
        run: mkdir cmake-build-release

      - name: Configure CMake
        # Use a bash shell so we can use the same syntax for environment variable
        # access regardless of the host operating system
        shell: bash
        working-directory: ${{github.workspace}}/cmake-build-release
        run: cmake -GNinja -S $GITHUB_WORKSPACE -B . \
          -DCMAKE_BUILD_TYPE=Release -DOPTION_ENABLE_ALL_APPS=OFF -DOPTION_BUILD_APPS_CMP_CLI=ON \
          -DOPTION_BUILD_APPS_CMP_GUI=ON -DOPTION_CMP_VULKAN=ON

      - name: Build
        working-directory: ${{github.workspace}}/cmake-build-release
        shell: bash      
        # Execute the build.  You can specify a specific target with "--target <NAME>"
        run: ninja

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with: 
            name: Compressonator_${{ runner.arch }}_${{ runner.os }}_${{ github.ref_name }}_Build
            path: ${{github.workspace}}/cmake-build-release/bin/
  
